<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Aster video</title>
<style>html,body{margin:0;height:100%;background:#101722;color:#e7eef8;font:14px 'Segoe UI',sans-serif}main{height:100%;display:flex;flex-direction:column}#player{flex:1;min-height:270px;width:100%;border:0}#status{padding:12px 16px;line-height:1.5;background:#182435}a{color:#66d7f3}</style></head>
<body><main><div id="player"></div><div id="status" role="status" aria-live="polite">Loading YouTube’s embedded player…</div></main>
<script>
'use strict';
let player, ready=false;
const status=document.getElementById('status');
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{videoId:'bNyUyrR0PHo',width:'100%',height:'100%',host:'https://www.youtube-nocookie.com',playerVars:{autoplay:0,controls:1,playsinline:1,fs:0,origin:location.origin},events:{onReady:()=>{ready=true;status.textContent='Ready — press Play to watch here in Aster.';},onStateChange:e=>{if(e.data===1)status.textContent='Playing inside Aster';else if(e.data===2)status.textContent='Paused';else if(e.data===0)status.textContent='Video ended';},onError:e=>{ready=true;const errors={2:'The video address is invalid.',5:'YouTube could not play this video in the embedded player.',100:'This video is unavailable or private.',101:'The owner has disabled embedded playback.',150:'The owner has disabled embedded playback.',153:'YouTube could not verify the embedded player identity.'};status.textContent=(errors[e.data]||'YouTube could not load this video.')+' You can retry with Reload player.';}}});
}
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{ready=true;status.textContent='Unable to reach YouTube. Check your connection, then reload.';};document.head.appendChild(script);
setTimeout(()=>{if(!ready)status.textContent='YouTube is taking longer than expected. Check your connection or select Reload player.';},20000);
window.addEventListener('pagehide',()=>{if(player&&player.destroy)player.destroy();});
</script></body></html>
